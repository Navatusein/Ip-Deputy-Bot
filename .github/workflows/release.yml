name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          last=$(git tag --list "v*.*.*" --sort=-v:refname | head -n 1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          major=${major#v}
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "previous=$last" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          range="${{ steps.version.outputs.previous }}"
          range="${range:+$range..}HEAD"
          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --pretty="- %s (%h)"
          } > CHANGELOG.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file CHANGELOG.md

  docker:
    name: Docker
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
