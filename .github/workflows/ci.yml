name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  check:
    name: Lint and check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff
        run: ruff check .

      - name: Compile sources
        run: python -m compileall -q bot main.py

      - name: Compile translations
        run: pybabel compile -d locales -D default --statistics
